[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xhh-agent"
version = "0.1.0"
description = "让 AI agent 通过自己的小黑盒账号发帖与回复"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# 版本给上下界：下界是验证过能用的最低版本，上界防止未来大版本破坏行为。
# 实际验证通过的版本见 README「迁移到新机器」一节。
dependencies = [
    "aiohttp>=3.9,<4",
    "markdown>=3.5,<4",
    "pygments>=2.17,<3",
    "pillow>=10.0,<13",
    "qrcode>=7.4,<9",
    # content/markdown_converter.py 用它下载远程图片（上游代码依赖）
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.4",
]

[project.scripts]
xhh = "xhh_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
