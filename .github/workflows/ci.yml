name: ci

on:
  push:
    branches: [main, master, feat/dsh-go-mobile]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 代码块/表格要渲染成图片，Linux runner 默认没有中文字体
      - name: 安装中文字体
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 语法与未定义名
        run: ruff check src --select E9,F63,F7,F82

      - name: 测试
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: DSH Go 手机适配测试
        run: node --test integrations/dsh-go/test/*.test.js

  dsh-go-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ccch1mneyyy/dsh-Go
          ref: e68525951f98d250768ee5b1c7b0eb4a83ef6140
          path: .dsh-go-sdk
          sparse-checkout: sdk/plugin-kit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 官方原生插件加载检查
        run: node .dsh-go-sdk/sdk/plugin-kit/bin/check.mjs integrations/dsh-go --load
      - name: 手机原生视图和真实数据预算
        run: node --test integrations/dsh-go/test/*.test.js
        env:
          DSH_GO_SDK: ${{ github.workspace }}/.dsh-go-sdk/sdk/plugin-kit

  app-native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/heybox-app/package-lock.json
      - name: 安装本机App登录依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: integrations/heybox-app
      - name: 校验来源并重建原生运行时
        run: npm run build
        working-directory: integrations/heybox-app
      - name: 校验原生签名与任务执行保护
        run: npm test
        working-directory: integrations/heybox-app
