name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 代码块/表格要渲染成图片，Linux runner 默认没有中文字体
      - name: 安装中文字体
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 语法与未定义名
        run: ruff check src --select E9,F63,F7,F82

      - name: 测试
        run: pytest -q
